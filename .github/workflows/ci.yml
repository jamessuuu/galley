name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: typecheck, lint, unit, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Chrome Headless Shell (Remotion's renderer) needs these shared libs on
      # Debian-based runners. Installed defensively — without them the e2e
      # render step fails with a native library error, not a code bug, and
      # the test itself is written to skip-with-logged-reason in that case
      # (see src/render/e2e.test.ts) rather than fail the whole suite.
      - name: Install Chromium runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libcups2

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + e2e tests
        run: npm test -- --reporter=verbose
        env:
          CI: true

      - name: Upload e2e render artifact (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-render
          path: |
            src/render/__e2e_out__/**
          if-no-files-found: ignore
